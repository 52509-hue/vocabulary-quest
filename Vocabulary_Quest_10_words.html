<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quest</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;color:#222}
.game{width:min(760px,94%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.25)}
h1{text-align:center;margin:0 0 8px;color:#5b4bc4}
.subtitle{text-align:center;color:#777;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:#f4f2ff;border-radius:14px;padding:10px;text-align:center;font-weight:bold}
.question-box{background:#f8f9ff;border-radius:18px;padding:22px;margin:15px 0}
.level{text-align:center;color:#6b5bd3;font-weight:bold}
#question{text-align:center;font-size:25px;margin:15px 0 20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{border:2px solid #ddd;background:#fff;border-radius:14px;padding:14px;font-size:17px;cursor:pointer;transition:.2s}
.answer:hover{transform:translateY(-2px);border-color:#6b5bd3}
.answer.correct{background:#d9f8df;border-color:#36a852}
.answer.wrong{background:#ffdcdc;border-color:#e53935}
#timer{text-align:center;font-size:20px;font-weight:bold;margin:14px}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}
#hint{background:#ffd54f}
#next{background:#6b5bd3;color:#fff;float:right}
.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin-top:15px}
#bar{height:100%;width:0;background:#6b5bd3;transition:.3s}
.clear{clear:both}
#result{text-align:center;display:none}
#result h2{font-size:34px;color:#5b4bc4}
.rank{font-size:24px;font-weight:bold;margin:15px}
#restart{background:#6b5bd3;color:#fff}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}#question{font-size:21px}}
</style>
</head>
<body>
<div class="game">
<section id="game">
<h1>📚 Vocabulary Quest</h1>
<div class="subtitle">Vocabulary for Entrance</div>

<div class="stats">
<div class="stat">❤️ <span id="lives">3</span></div>
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">🔥 <span id="combo">0</span></div>
<div class="stat">⭐ <span id="score">0</span></div>
</div>

<div class="question-box">
<div class="level">Question <span id="number">1</span>/10</div>
<div id="question"></div>
<div id="timer">⏱️ 15s</div>
<div class="answers" id="answers"></div>
<div class="progress"><div id="bar"></div></div>
</div>

<button id="hint">💡 Hint (FREE)</button>
<button id="next" style="display:none">Next ➜</button>
<div class="clear"></div>
</section>

<section id="result">
<h2>🏆 Quest Complete!</h2>
<p>Your Score</p>
<div class="rank" id="rank"></div>
<p>⭐ Score: <span id="finalScore"></span></p>
<p>✅ Correct: <span id="correct"></span>/10</p>
<button id="restart">🔄 Play Again</button>
</section>
</div>

<script>
const questions=[
{q:"What does “abandon” mean?",a:["ยอมรับ","ละทิ้ง","ช่วยเหลือ","ปรับเปลี่ยน"],c:1},
{q:"What is the synonym of “abate”?",a:["lessen","increase","protect","divide"],c:0},
{q:"What does “accurate” mean?",a:["คลุมเครือ","รวดเร็ว","ถูกต้องแม่นยำ","แปลก"],c:2},
{q:"What is the synonym of “admire”?",a:["respect","reject","confuse","blame"],c:0},
{q:"What does “agriculture” mean?",a:["การเลือกตั้ง","เกษตรกรรม","การแข่งขัน","การเดินทาง"],c:1},
{q:"What is the synonym of “beneficial”?",a:["harmful","useful","strange","difficult"],c:1},
{q:"What does “drought” mean?",a:["ความแห้งแล้ง","ความสมดุล","ความก้าวหน้า","ความยุติธรรม"],c:0},
{q:"What is the synonym of “efficient”?",a:["effective","enormous","ancient","fragile"],c:0},
{q:"What does “essential” mean?",a:["unnecessary","important","temporary","ordinary"],c:1},
{q:"What is the synonym of “punctual”?",a:["on time","late","distant","careless"],c:0}
];

let current=0,score=0,coins=0,lives=3,combo=0,correctCount=0,time=15,answered=false,timer;

const $=id=>document.getElementById(id);

function loadQuestion(){
 answered=false;
 $("next").style.display="none";
 $("number").textContent=current+1;
 $("bar").style.width=((current)/questions.length*100)+"%";
 const x=questions[current];
 $("question").textContent=x.q;
 $("answers").innerHTML="";
 x.a.forEach((ans,i)=>{
   const b=document.createElement("button");
   b.className="answer";
   b.textContent=ans;
   b.onclick=()=>checkAnswer(i,b);
   $("answers").appendChild(b);
 });
 startTimer();
}

function startTimer(){
 clearInterval(timer); time=15; $("timer").textContent="⏱️ 15s";
 timer=setInterval(()=>{
   time--;
   $("timer").textContent="⏱️ "+time+"s";
   if(time<=0){clearInterval(timer);timeUp();}
 },1000);
}

function checkAnswer(i,btn){
 if(answered)return;
 answered=true;clearInterval(timer);
 const x=questions[current];
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
 if(i===x.c){
   btn.classList.add("correct");
   combo++;
   correctCount++;
   const pts=10+(combo-1)*2;
   score+=pts;coins+=5;
 }else{
   btn.classList.add("wrong");
   document.querySelectorAll(".answer")[x.c].classList.add("correct");
   lives--;combo=0;
 }
 update();
 $("next").style.display="block";
 if(lives<=0) setTimeout(endGame,700);
}

function timeUp(){
 if(answered)return;
 answered=true; lives--;combo=0;
 const x=questions[current];
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
 document.querySelectorAll(".answer")[x.c].classList.add("correct");
 update();
 $("next").style.display="block";
 if(lives<=0)setTimeout(endGame,700);
}

$("next").onclick=()=>{
 if(lives<=0)return endGame();
 current++;
 if(current>=questions.length)endGame();
 else loadQuestion();
};

$("hint").onclick=()=>{
 if(answered)return;
 const x=questions[current];
 const wrong=[...document.querySelectorAll(".answer")].filter((_,i)=>i!==x.c);
 wrong.slice(0,2).forEach(b=>{b.style.visibility="hidden"});
 update();
};

function update(){
 $("lives").textContent=lives;
 $("coins").textContent=coins;
 $("combo").textContent=combo;
 $("score").textContent=score;
}

function endGame(){
 clearInterval(timer);
 $("game").style.display="none";
 $("result").style.display="block";
 $("finalScore").textContent=score;
 $("correct").textContent=correctCount;
 let rank;
 if(correctCount===10)rank="🏆 Vocabulary Master";
 else if(correctCount>=8)rank="🥇 Vocabulary Expert";
 else if(correctCount>=5)rank="🥈 Good Learner";
 else rank="📖 Keep Practicing";
 $("rank").textContent=rank;
}

$("restart").onclick=()=>{
 current=0;score=0;coins=0;lives=3;combo=0;correctCount=0;
 $("game").style.display="block";$("result").style.display="none";
 update();loadQuestion();
};

loadQuestion();
</script>
</body>
</html>
